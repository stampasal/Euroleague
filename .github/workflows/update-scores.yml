name: Update EuroLeague Scores

on:
  schedule:
    # Κάθε μέρα στις 06:00 UTC (09:00 ώρα Ελλάδας)
    - cron: '0 6 * * *'
  workflow_dispatch:   # Για να μπορείς να το τρέξεις manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Για να μπορεί να κάνει push

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install euroleague-api

      - name: 🏀 Run updater script
        run: |
          python "py/Update EuroLeague Scores.py"

      - name: 💾 Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Δεν υπάρχουν αλλαγές για commit"
          else
            git commit -m "🤖 Auto-update scores · $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
